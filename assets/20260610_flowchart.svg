<svg viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"></path>
    </marker>
  </defs>

  <!-- nodes -->
  <g font-size="13" font-weight="700">
    <rect x="20" y="30" width="150" height="54" rx="8" fill="#f0fdfa" stroke="#5eead4"></rect>
    <text x="95" y="52" text-anchor="middle" fill="#0d9488">specs (IR)</text>
    <text x="95" y="70" text-anchor="middle" font-size="10" font-weight="400" fill="#64748b">VariableSpec / RowSpec</text>

    <rect x="210" y="30" width="150" height="54" rx="8" fill="#f0fdfa" stroke="#5eead4"></rect>
    <text x="285" y="52" text-anchor="middle" fill="#0d9488">manifest</text>
    <text x="285" y="70" text-anchor="middle" font-size="10" font-weight="400" fill="#64748b">AssemblyManifest</text>

    <rect x="400" y="30" width="150" height="54" rx="8" fill="#fff7ed" stroke="#fdba74"></rect>
    <text x="475" y="52" text-anchor="middle" fill="#ea580c">validate!</text>
    <text x="475" y="70" text-anchor="middle" font-size="10" font-weight="400" fill="#64748b">6 named errors</text>

    <rect x="590" y="30" width="150" height="54" rx="8" fill="#f5f3ff" stroke="#c4b5fd"></rect>
    <text x="665" y="52" text-anchor="middle" fill="#7c3aed">compile</text>
    <text x="665" y="70" text-anchor="middle" font-size="10" font-weight="400" fill="#64748b">+ verify_sparsity</text>

    <rect x="590" y="170" width="150" height="54" rx="8" fill="#dbeafe" stroke="#93c5fd"></rect>
    <text x="665" y="192" text-anchor="middle" fill="#2563eb">ResidualProgram</text>
    <text x="665" y="210" text-anchor="middle" font-size="10" font-weight="400" fill="#64748b">integer maps + kernels</text>

    <rect x="400" y="170" width="150" height="54" rx="8" fill="#f0fdf4" stroke="#86efac"></rect>
    <text x="475" y="192" text-anchor="middle" fill="#16a34a">solve_program</text>
    <text x="475" y="210" text-anchor="middle" font-size="10" font-weight="400" fill="#64748b">NonlinearSolve</text>

    <rect x="210" y="170" width="150" height="54" rx="8" fill="#fffbeb" stroke="#fcd34d"></rect>
    <text x="285" y="192" text-anchor="middle" fill="#d97706">diagnose</text>
    <text x="285" y="210" text-anchor="middle" font-size="10" font-weight="400" fill="#64748b">worst scaled rows</text>
  </g>

  <!-- arrows — endpoints snapped exactly to box edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M170,57 L210,57"></path>
    <path d="M360,57 L400,57"></path>
    <path d="M550,57 L590,57"></path>
    <path d="M665,84 L665,170"></path>
    <path d="M590,197 L550,197"></path>
    <path d="M400,197 L360,197"></path>
  </g>

  <!-- guarantee annotations -->
  <g font-size="9.5" fill="#475569">
    <text x="190" y="22" text-anchor="middle">declarative</text>
    <text x="378" y="22" text-anchor="middle">determinism</text>
    <text x="568" y="22" text-anchor="middle">named errors</text>
    <!-- stacked vertically beside the compile→ResidualProgram arrow -->
    <text x="750" y="120" text-anchor="middle">zero-alloc</text>
    <text x="750" y="135" text-anchor="middle">sparsity contract</text>
    <text x="475" y="246" text-anchor="middle">convergence reporting</text>
    <text x="285" y="246" text-anchor="middle">actionable failure</text>
  </g>

  <!-- caption row -->
  <g font-size="11" fill="#1e293b" font-weight="600">
    <text x="440" y="320" text-anchor="middle">specs → manifest → validate! → compile → ResidualProgram → solve → diagnose</text>
  </g>
  <g font-size="10.5" fill="#64748b">
    <text x="440" y="345" text-anchor="middle">Readable string/symbol IDs at authoring time; deterministic integer row/column indices in the hot loop.</text>
    <text x="440" y="362" text-anchor="middle">Kernels receive ONLY their gathered declared deps — silent structural sparsity leaks are impossible by construction.</text>
  </g>
</svg>
